<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2d">
  <title>Even op adem</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f5f0; --muted:#aab3c3; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:0;
      color:var(--ink); font-family:ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", sans-serif; background:#000;
    }
    main {
      width:100%; min-height:100vh; position:relative; overflow:hidden;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:clamp(36px,8vw,76px); text-align:center;
      border:1px solid rgba(255,255,255,.14); border-radius:clamp(18px,2.5vw,32px);
      background:radial-gradient(ellipse at 18% 18%,#294361 0,transparent 42%),
                 radial-gradient(ellipse at 82% 82%,#49374f 0,transparent 40%),#101a2d;
      box-shadow:0 32px 90px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.1);
      backdrop-filter:blur(18px);
    }
    main::before, main::after {
      content:""; position:absolute; width:190px; height:190px; border-radius:50%;
      filter:blur(1px); opacity:.5; pointer-events:none;
    }
    main::before { top:-120px; right:-42px; background:#91c4cd; }
    main::after  { bottom:-145px; left:-40px; background:#c398a5; }

    #clock {
      font-size:clamp(76px,18vw,148px); font-weight:300;
      letter-spacing:-.075em; line-height:.95; font-variant-numeric:tabular-nums;
    }
    #date { margin:24px 0 0; color:var(--muted); font-size:clamp(15px,2.5vw,19px); font-weight:450; }

    /* ---------- Zoeken ---------- */
    .search { width:min(100%,430px); margin-top:34px; position:relative; z-index:1; }
    .search input {
      width:100%; height:56px; padding:0 22px 0 52px; border-radius:999px;
      border:1px solid rgba(255,255,255,.2); outline:none; color:var(--ink);
      background:rgba(7,14,27,.32); font:inherit; font-size:15px;
      box-shadow:inset 0 1px rgba(255,255,255,.08);
      transition:background .2s, border-color .2s, box-shadow .2s;
    }
    .search input::placeholder { color:#aab3c3; }
    .search input:focus {
      background:rgba(7,14,27,.52); border-color:rgba(210,231,243,.65);
      box-shadow:0 0 0 4px rgba(210,231,243,.1);
    }
    .search svg { position:absolute; left:20px; top:17px; color:#aab3c3; pointer-events:none; }

    /* ---------- Nexi-knop (alleen logo, geen animatie) ---------- */
    .nexi-fab {
      position:fixed;
      right:clamp(16px,3vw,28px);
      bottom:calc(clamp(16px,3vw,28px) + env(safe-area-inset-bottom, 0px));
      z-index:40;
      width:60px; height:60px;
      display:grid; place-items:center;
      padding:0; cursor:pointer;
      border-radius:50%;
      background:radial-gradient(circle at 30% 25%, #1e2f4b, #0b1626 72%);
      border:1px solid rgba(210,231,243,.28);
      box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 1px rgba(255,255,255,.14);
      transition:transform .18s ease, border-color .18s ease, filter .18s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .nexi-fab img {
      width:34px; height:34px; object-fit:contain; display:block;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));
      pointer-events:none;
    }
    .nexi-fab:hover { transform:translateY(-2px); border-color:rgba(210,231,243,.55); filter:brightness(1.08); }
    .nexi-fab:active { transform:translateY(0); }
    .nexi-fab:focus-visible { outline:2px solid #d2e7f3; outline-offset:3px; }

    /* ---------- Nexi-venster ---------- */
    .nexi-panel {
      position:fixed;
      right:clamp(16px,3vw,28px);
      bottom:calc(clamp(16px,3vw,28px) + 60px + 14px + env(safe-area-inset-bottom, 0px));
      z-index:39;
      width:min(380px, calc(100vw - 32px));
      height:min(560px, calc(100vh - 140px));
      display:none;
      flex-direction:column;
      overflow:hidden;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.16);
      background:#0c1626;
      box-shadow:0 28px 70px rgba(0,0,0,.6), inset 0 1px rgba(255,255,255,.08);
    }
    .nexi-panel[data-open="true"] {
      display:flex;
      animation:nexiIn .18s ease-out both;
    }
    @keyframes nexiIn {
      from { opacity:0; transform:translateY(10px) scale(.985); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    .nexi-panel__bar {
      flex:0 0 auto;
      display:flex; align-items:center; gap:10px;
      padding:10px 10px 10px 14px;
      background:linear-gradient(180deg, rgba(41,67,97,.55), rgba(16,26,45,.2));
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    .nexi-panel__bar img { width:20px; height:20px; object-fit:contain; display:block; }
    .nexi-panel__title {
      flex:1 1 auto; min-width:0;
      font-size:14px; font-weight:600; letter-spacing:.01em;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .nexi-panel__close {
      flex:0 0 auto;
      width:34px; height:34px; padding:0;
      display:grid; place-items:center;
      border:0; border-radius:10px; cursor:pointer;
      color:var(--ink); background:transparent;
      transition:background .15s ease;
    }
    .nexi-panel__close:hover { background:rgba(255,255,255,.12); }
    .nexi-panel__close:focus-visible { outline:2px solid #d2e7f3; outline-offset:1px; }

    .nexi-panel iframe {
      flex:1 1 auto; width:100%; height:100%;
      border:0; display:block; background:#0c1626;
    }

    @media (max-width:480px){
      main { min-height:100vh; border-radius:22px; padding:32px 24px 100px; }
      .nexi-fab { width:56px; height:56px; }
      .nexi-fab img { width:32px; height:32px; }
      .nexi-panel {
        right:8px; left:8px; width:auto;
        bottom:calc(8px + 56px + 12px + env(safe-area-inset-bottom, 0px));
        height:min(70vh, calc(100vh - 130px));
      }
    }
    @media (prefers-reduced-motion: reduce){
      * { transition:none !important; animation:none !important; }
      .nexi-fab:hover { transform:none; }
    }
  </style>
</head>
<body>

<main aria-label="Klok en datum">
  <time id="clock" aria-label="Lokale tijd"></time>
  <time id="date"></time>

  <form class="search" action="https://www.bing.com/search" method="get" role="search">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
      <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/>
      <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <input type="search" name="q"
           placeholder="Waar ben je naar op zoek?"
           aria-label="Zoeken op Bing" autocomplete="off">
  </form>
</main>

<!-- Nexi-venster (verschijnt pas bij klik) -->
<section class="nexi-panel" id="nexiPanel" data-open="false"
         role="dialog" aria-modal="false" aria-label="Chat met Nexi" hidden>
  <div class="nexi-panel__bar">
    <img src="https://jimisdebest.github.io/nexi/logo.png" alt="" width="20" height="20">
    <span class="nexi-panel__title">Nexi</span>
    <button type="button" class="nexi-panel__close" id="nexiClose" aria-label="Sluit chatvenster">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <iframe id="nexiFrame"
          title="Chat met Nexi"
          data-src="https://jimisdebest.github.io/nexi/train"
          referrerpolicy="no-referrer"
          allow="clipboard-write; microphone; autoplay"></iframe>
</section>

<!-- Nexi-knop (alleen logo) -->
<button type="button" class="nexi-fab" id="nexiFab"
        aria-label="Chat met Nexi" aria-controls="nexiPanel" aria-expanded="false">
  <img src="https://jimisdebest.github.io/nexi/logo.png" alt="" width="34" height="34">
</button>

<script>
(() => {
  'use strict';

  /* ---------- Klok ---------- */
  const clockEl = document.getElementById('clock');
  const dateEl  = document.getElementById('date');
  const tF = new Intl.DateTimeFormat('nl-NL', { hour:'2-digit', minute:'2-digit', hour12:false });
  const dF = new Intl.DateTimeFormat('nl-NL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  function tick(){
    const n = new Date();
    clockEl.textContent = tF.format(n);
    clockEl.dateTime = n.toISOString();
    dateEl.textContent = dF.format(n);
    dateEl.dateTime = n.toISOString().slice(0,10);
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Nexi-paneel ---------- */
  const fab    = document.getElementById('nexiFab');
  const panel  = document.getElementById('nexiPanel');
  const closeB = document.getElementById('nexiClose');
  const frame  = document.getElementById('nexiFrame');

  let loaded = false;

  function isOpen(){
    return panel.dataset.open === 'true';
  }

  function openPanel(){
    if (!loaded){
      frame.src = frame.dataset.src;   // pas laden bij eerste keer openen
      loaded = true;
    }
    panel.hidden = false;
    panel.dataset.open = 'true';
    fab.setAttribute('aria-expanded', 'true');
    closeB.focus({ preventScroll:true });
  }

  function closePanel(){
    panel.dataset.open = 'false';
    panel.hidden = true;
    fab.setAttribute('aria-expanded', 'false');
    fab.focus({ preventScroll:true });
  }

  fab.addEventListener('click', () => {
    isOpen() ? closePanel() : openPanel();
  });

  closeB.addEventListener('click', closePanel);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isOpen()) closePanel();
  });

  /* Klik buiten het paneel sluit het (behalve op de knop zelf) */
  document.addEventListener('pointerdown', (e) => {
    if (!isOpen()) return;
    if (panel.contains(e.target) || fab.contains(e.target)) return;
    closePanel();
  });
})();
</script>
</body>
</html>
