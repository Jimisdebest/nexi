<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexi</title>
<link rel="icon" href="logo.png">

<style>
:root {
  --bg:#f3f4f7;--panel:#fff;--soft:#f7f8fa;--text:#20232b;
  --muted:#9298a4;--border:#e7e9ee;--accent:#647ff2;
  --accentSoft:#edf0ff;--bot:#f0f1f4;--danger:#e05b5b;
}
[data-theme="dark"]{
  --bg:#16181d;--panel:#20232a;--soft:#282c34;--text:#f2f3f5;
  --muted:#999fac;--border:#343841;--accent:#8398ff;
  --accentSoft:#303750;--bot:#2b2f37;--danger:#ff7777;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);background:var(--bg);height:100dvh;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;width:100%;height:100dvh;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:275px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  padding:17px 13px;z-index:5
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.brand img{width:40px;height:40px;object-fit:cover;border-radius:13px}
.brand-name{font-size:20px;font-weight:750;letter-spacing:-.6px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:3px}
.new-chat{
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  padding:12px;border-radius:12px;display:flex;gap:10px;align-items:center
}
.new-chat:hover{background:var(--accentSoft);border-color:var(--accent)}
.new-chat span{font-size:20px;color:var(--accent)}
.search{position:relative;margin:16px 0}
.search input{
  width:100%;border:1px solid transparent;border-radius:10px;
  background:var(--soft);padding:10px 12px 10px 34px;
  outline:none;color:var(--text);font-size:13px
}
.search input:focus{border-color:var(--accent)}
.search span{position:absolute;left:12px;top:10px;color:var(--muted)}
.label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.7px;padding:0 8px 9px}
.chat-list{flex:1;overflow-y:auto;min-height:0}
.chat-item{display:flex;align-items:center;gap:9px;padding:10px;border-radius:11px;cursor:pointer;margin-bottom:3px}
.chat-item:hover{background:var(--soft)}
.chat-item.active{background:var(--accentSoft)}
.chat-icon{width:33px;height:33px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.chat-info{flex:1;min-width:0}
.chat-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-preview{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{border:0;background:transparent;color:var(--muted);padding:5px;border-radius:7px;opacity:0}
.chat-item:hover .more,.chat-item.active .more{opacity:1}
.more:hover{background:var(--border)}
.sidebar-bottom{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.bottom-row{display:flex;align-items:center;gap:6px;padding:5px}
.profile{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.profile-avatar{width:34px;height:34px;border-radius:50%;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.profile-name{font-size:13px;font-weight:600}
.profile-sub{font-size:11px;color:var(--muted);margin-top:2px}
.icon-btn{border:0;background:transparent;color:var(--muted);border-radius:9px;width:36px;height:36px}
.icon-btn:hover{background:var(--soft);color:var(--text)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:65px;min-height:65px;display:flex;align-items:center;
  padding:0 22px;gap:12px;background:var(--panel);
  border-bottom:1px solid var(--border)
}
.mobile-menu{display:none}
.header-title{font-size:15px;font-weight:650}
.header-sub{font-size:11px;color:var(--muted);margin-top:3px}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#48c58b}

/* CHAT */
.messages{flex:1;overflow-y:auto;padding:26px 18px;scroll-behavior:smooth}
.message-container{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:20px}
.message{display:flex;align-items:flex-start;gap:11px;animation:fade .15s ease}
.message.user{flex-direction:row-reverse}
.avatar{
  width:34px;height:34px;flex-shrink:0;border-radius:11px;
  background:var(--panel);border:1px solid var(--border);
  display:grid;place-items:center;overflow:hidden;font-size:13px
}
.avatar img{width:100%;height:100%;object-fit:cover}
.body{max-width:min(78%,650px)}
.message.user .body{display:flex;flex-direction:column;align-items:flex-end}
.name{font-size:11px;font-weight:600;color:var(--muted);margin:0 4px 6px}
.bubble{
  border-radius:17px;padding:12px 15px;line-height:1.6;font-size:14px;
  white-space:pre-wrap;overflow-wrap:anywhere
}
.bot .bubble{background:var(--bot);border-top-left-radius:5px}
.user .bubble{background:var(--accent);color:white;border-top-right-radius:5px}
.bubble img{max-width:100%;max-height:350px;border-radius:12px;margin-top:8px;display:block}
.analysis{
  margin-top:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:11px 13px;font-size:12px;color:var(--muted)
}
.analysis strong{display:block;color:var(--text);margin-bottom:7px}
.analysis div{margin-top:5px}
.thinking .bubble{color:var(--muted)}
.dots{display:inline-flex;gap:4px;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}

/* EMPTY CHAT */
.empty{
  min-height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:30px
}
.empty img{width:70px;height:70px;object-fit:cover;border-radius:23px;margin-bottom:22px}
.empty h2{font-size:clamp(23px,4vw,34px);letter-spacing:-1px}
.empty p{color:var(--muted);font-size:14px;margin-top:9px}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:26px}
.suggestion{
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:10px 13px;border-radius:12px;font-size:12px
}
.suggestion:hover{background:var(--accentSoft);border-color:var(--accent)}

/* INPUT */
.composer-wrap{padding:12px 20px 17px;background:var(--bg)}
.composer{
  max-width:850px;margin:auto;background:var(--panel);border:1px solid var(--border);
  border-radius:17px;box-shadow:0 8px 30px rgba(30,40,70,.04)
}
.composer:focus-within{border-color:var(--accent)}
textarea{
  display:block;width:100%;resize:none;max-height:150px;min-height:52px;
  padding:14px 16px 8px;border:0;outline:0;background:transparent;
  color:var(--text);font-size:14px;line-height:1.5
}
textarea::placeholder{color:var(--muted)}
.composer-bottom{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 10px}
.tools{display:flex;gap:3px}
.tool{
  border:0;background:transparent;color:var(--muted);padding:7px 9px;
  border-radius:9px;font-size:12px
}
.tool:hover{background:var(--soft);color:var(--text)}
.send{
  width:36px;height:36px;border:0;border-radius:11px;
  background:var(--accent);color:white;font-size:18px
}
.send:disabled{opacity:.4}
.disclaimer{max-width:850px;margin:8px auto 0;text-align:center;color:var(--muted);font-size:10px}

/* MENU / TOAST */
.menu{
  position:fixed;z-index:20;width:170px;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;padding:5px;
  box-shadow:0 8px 30px rgba(0,0,0,.1)
}
.menu button{
  display:block;width:100%;text-align:left;padding:10px;border:0;
  background:transparent;color:var(--text);border-radius:8px;font-size:12px
}
.menu button:hover{background:var(--soft)}
.menu .delete{color:var(--danger)}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--panel);padding:11px 16px;
  border-radius:11px;font-size:12px;z-index:40;animation:fade .15s
}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#0004;z-index:4}

/* MODAL */
.backdrop{position:fixed;inset:0;z-index:30;background:#0005;display:grid;place-items:center;padding:20px}
.modal{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:15px}
.modal input{width:100%;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);outline:0;margin-bottom:14px}
.modal input:focus{border-color:var(--accent)}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{padding:10px 13px;border-radius:10px;border:1px solid var(--border);background:var(--soft);color:var(--text);font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.danger{color:var(--danger)}
.settings-buttons{display:flex;flex-direction:column;gap:9px;margin-bottom:17px}
.settings-buttons .btn{text-align:left}

/* SCROLLBARS */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

@media(max-width:720px){
  .sidebar{position:fixed;inset:0 auto 0 0;width:285px;transform:translateX(-100%);transition:transform .2s;box-shadow:none}
  .sidebar.open{transform:translateX(0);box-shadow:10px 0 40px #0002}
  .mobile-menu{display:block}
  .topbar{height:59px;min-height:59px;padding:0 12px}
  .messages{padding:19px 11px}
  .body{max-width:86%}
  .composer-wrap{padding:9px 10px 12px}
  .status{font-size:0}
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="logo.png" alt="Nexi" onerror="this.style.display='none'">
      <div>
        <div class="brand-name">Nexi</div>
        <div class="brand-sub">Jouw chatomgeving</div>
      </div>
    </div>

    <button class="new-chat" id="newChat"><span>＋</span> Nieuwe chat</button>

    <div class="search">
      <span>⌕</span>
      <input id="search" placeholder="Zoek chats..." type="search">
    </div>

    <div class="label">Gesprekken</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      <div class="bottom-row">
        <div class="profile">
          <div class="profile-avatar">N</div>
          <div>
            <div class="profile-name">Nexi</div>
            <div class="profile-sub">Lokale opslag</div>
          </div>
        </div>
        <button class="icon-btn" id="theme" title="Thema">◐</button>
        <button class="icon-btn" id="settings" title="Instellingen">⚙</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenu">☰</button>
      <div>
        <div class="header-title" id="headerTitle">Nexi</div>
        <div class="header-sub">Gesprek met Nexi</div>
      </div>
      <div class="spacer"></div>
      <div class="status"><span class="dot"></span> Beschikbaar</div>
      <button class="icon-btn" id="renameCurrent" title="Chat hernoemen">✎</button>
    </header>

    <section class="messages" id="messages">
      <div class="message-container" id="messageContainer"></div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Typ een bericht aan Nexi..."></textarea>
        <div class="composer-bottom">
          <div class="tools">
            <button class="tool" id="analysisToggle">⌘ Analyse</button>
            <button class="tool" id="exportChat">↓ Chat exporteren</button>
          </div>
          <button class="send" id="send" title="Versturen">↑</button>
        </div>
      </div>
      <div class="disclaimer">Nexi zoekt in zijn opgeslagen antwoorden en kennis.</div>
    </div>
  </main>
</div>

<div id="overlay" class="overlay hidden"></div>
<div id="modalRoot"></div>
<div id="menu" class="menu hidden"></div>
<div id="toastRoot"></div>
<input type="file" id="backupInput" accept=".txt,text/plain" hidden>

<script>
/* ======================================================
   NEXI BACKUP — ALLE CHATS + GELEERDE KENNIS IN 1 TXT
====================================================== */

const STORAGE = "nexi_data_v3";
const THEME_KEY = "nexi_theme";
const BACKUP_MARKER = "NEXI BACKUP FILE";

let data = {
  version: 1,
  chats: [],
  learned: []
};

let currentChatId = null;
let qaDatabase = [];
let analysisMode = false;
let thinking = false;
let menuChatId = null;

const $ = id => document.getElementById(id);
const chatList = $("chatList");
const messageContainer = $("messageContainer");
const messages = $("messages");
const input = $("input");
const send = $("send");

/* ---------- HELPERS ---------- */

function id(){
  return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
}

function currentChat(){
  return data.chats.find(c => c.id === currentChatId) || null;
}

function escapeHTML(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function save(){
  try{
    localStorage.setItem(STORAGE, JSON.stringify(data));
  }catch(e){
    toast("Opslaan is mislukt. Mogelijk is de opslag vol.");
  }
}

function toast(message){
  $("toastRoot").innerHTML = "";
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = message;
  $("toastRoot").appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function time(t){
  return new Date(t).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
}

function safeFilename(s){
  return String(s).replace(/[\\/:*?"<>|]/g,"_").slice(0,80);
}

/* ---------- CHAT MANAGEMENT ---------- */

function createChat(name){
  const chat = {
    id:id(),
    title:name || "Nieuwe chat",
    created:Date.now(),
    updated:Date.now(),
    messages:[]
  };
  data.chats.unshift(chat);
  currentChatId = chat.id;
  save();
  renderChats();
  renderMessages();
  updateHeader();
  closeSidebar();

  if(!name){
    renameChat(chat.id,true);
  }
  input.focus();
  return chat;
}

function switchChat(chatId){
  currentChatId = chatId;
  renderChats();
  renderMessages();
  updateHeader();
  closeSidebar();
}

function renameChat(chatId,createMode=false){
  const chat = data.chats.find(c=>c.id===chatId);
  if(!chat) return;

  const name = prompt("Naam van de chat:", chat.title);
  if(name === null) return;
  if(!name.trim()){
    if(createMode) chat.title = "Nieuwe chat";
    save();renderChats();updateHeader();
    return;
  }
  chat.title = name.trim();
  chat.updated = Date.now();
  save();renderChats();updateHeader();
}

function deleteChat(chatId){
  const chat = data.chats.find(c=>c.id===chatId);
  if(!chat) return;
  if(!confirm(`Chat "${chat.title}" verwijderen?`)) return;

  data.chats = data.chats.filter(c=>c.id!==chatId);
  if(currentChatId===chatId){
    currentChatId = data.chats[0]?.id || null;
  }
  save();

  if(!currentChatId) createChat("Nieuwe chat");
  else {
    renderChats();renderMessages();updateHeader();
  }
}

function renderChats(){
  const query = $("search").value.toLowerCase().trim();
  chatList.innerHTML = "";

  data.chats.filter(c=>{
    const last = c.messages?.at(-1)?.text || "";
    return c.title.toLowerCase().includes(query) || last.toLowerCase().includes(query);
  }).forEach(chat=>{
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id===currentChatId?" active":"");

    const icon = document.createElement("div");
    icon.className = "chat-icon";
    icon.textContent = "▤";

    const info = document.createElement("div");
    info.className = "chat-info";

    const title = document.createElement("div");
    title.className = "chat-title";
    title.textContent = chat.title;

    const preview = document.createElement("div");
    preview.className = "chat-preview";
    preview.textContent = chat.messages?.at(-1)?.text || "Nog geen berichten";

    info.append(title,preview);

    const more = document.createElement("button");
    more.className = "more";
    more.textContent = "⋯";
    more.onclick = e=>{
      e.stopPropagation();
      showMenu(chat.id,more);
    };

    item.append(icon,info,more);
    item.onclick = ()=>switchChat(chat.id);
    chatList.appendChild(item);
  });
}

function updateHeader(){
  $("headerTitle").textContent = currentChat()?.title || "Nexi";
}

/* ---------- CHAT MENU ---------- */

function showMenu(chatId,button){
  menuChatId = chatId;
  const r = button.getBoundingClientRect();
  $("menu").innerHTML = `
    <button data-action="rename">✎ &nbsp; Hernoemen</button>
    <button data-action="export">↓ &nbsp; Exporteren</button>
    <button class="delete" data-action="delete">⌫ &nbsp; Verwijderen</button>
  `;
  $("menu").classList.remove("hidden");
  $("menu").style.left = Math.min(r.left,innerWidth-180)+"px";
  $("menu").style.top = Math.min(r.bottom+4,innerHeight-150)+"px";

  $("menu").querySelectorAll("[data-action]").forEach(b=>{
    b.onclick=()=>{
      $("menu").classList.add("hidden");
      const action=b.dataset.action;
      if(action==="rename") renameChat(chatId);
      if(action==="delete") deleteChat(chatId);
      if(action==="export") exportChat(chatId);
    };
  });
}
document.addEventListener("click",e=>{
  if(!$("menu").contains(e.target)) $("menu").classList.add("hidden");
});

/* ---------- MESSAGE DISPLAY ---------- */

function addMessage(role,text,analysis=null){
  const chat = currentChat();
  if(!chat) return null;

  const msg = {id:id(),role,text:String(text),time:Date.now(),analysis};
  chat.messages.push(msg);
  chat.updated = Date.now();
  save();
  renderMessages();
  renderChats();
  return msg;
}

function renderMessages(){
  messageContainer.innerHTML = "";
  const chat=currentChat();

  if(!chat || !chat.messages.length){
    showEmpty();
    return;
  }

  chat.messages.forEach(renderMessage);
  scrollBottom();
}

function showEmpty(){
  const empty=document.createElement("div");
  empty.className="empty";

  const logo=document.createElement("img");
  logo.src="logo.png";
  logo.alt="Nexi";
  logo.onerror=()=>logo.remove();

  const heading=document.createElement("h2");
  heading.textContent="Waar zullen we het over hebben?";

  const desc=document.createElement("p");
  desc.textContent="Begin een gesprek met Nexi.";

  const suggestions=document.createElement("div");
  suggestions.className="suggestions";

  [
    "Vertel me een leuk weetje",
    "Help me met Frans",
    "Wat kun je allemaal?",
    "Leg iets simpel uit"
  ].forEach(s=>{
    const b=document.createElement("button");
    b.className="suggestion";
    b.textContent=s;
    b.onclick=()=>{
      input.value=s;
      sendMessage();
    };
    suggestions.appendChild(b);
  });

  empty.append(logo,heading,desc,suggestions);
  messageContainer.appendChild(empty);
}

function renderMessage(msg){
  const wrapper=document.createElement("div");
  wrapper.className="message "+(msg.role==="user"?"user":"bot");

  const avatar=document.createElement("div");
  avatar.className="avatar";

  if(msg.role==="bot"){
    const img=document.createElement("img");
    img.src="logo.png";
    img.alt="Nexi";
    img.onerror=()=>{avatar.textContent="N";};
    avatar.appendChild(img);
  }else{
    avatar.textContent="J";
  }

  const body=document.createElement("div");
  body.className="body";

  const name=document.createElement("div");
  name.className="name";
  name.textContent=(msg.role==="user"?"Jij":"Nexi")+" · "+time(msg.time);

  const bubble=document.createElement("div");
  bubble.className="bubble";
  renderTextSafely(bubble,msg.text);

  body.append(name,bubble);

  if(analysisMode && msg.analysis){
    const panel=document.createElement("div");
    panel.className="analysis";
    const strong=document.createElement("strong");
    strong.textContent="Analyse";
    panel.appendChild(strong);
    msg.analysis.forEach(step=>{
      const row=document.createElement("div");
      row.textContent=(step.ok?"✓ ":"– ")+step.text;
      panel.appendChild(row);
    });
    body.appendChild(panel);
  }

  wrapper.append(avatar,body);
  messageContainer.appendChild(wrapper);
}

function renderTextSafely(container,text){
  const regex=/(https?:\/\/[^\s]+?\.(?:png|jpg|jpeg|gif|webp)(?:\?[^\s]*)?)/gi;
  const parts=String(text).split(regex);

  parts.forEach(part=>{
    if(!part) return;
    if(/^https?:\/\/.+\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i.test(part)){
      const img=document.createElement("img");
      img.src=part;img.alt="Afbeelding";img.loading="lazy";
      img.onerror=()=>img.remove();
      container.appendChild(img);
    }else{
      container.appendChild(document.createTextNode(part));
    }
  });
}

function scrollBottom(){
  requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight);
}

function showThinking(){
  const el=document.createElement("div");
  el.className="message bot thinking";
  el.id="thinking";
  el.innerHTML=`
    <div class="avatar"><img src="logo.png" onerror="this.parentElement.textContent='N'"></div>
    <div class="body">
      <div class="name">Nexi</div>
      <div class="bubble">Nexi zoekt... <span class="dots"><i></i><i></i><i></i></span></div>
    </div>`;
  messageContainer.appendChild(el);
  scrollBottom();
  return el;
}

/* ---------- REACTIES.TXT ---------- */

async function loadResponses(){
  try{
    const res=await fetch("https://raw.githubusercontent.com/jimisdebest/nexi/main/reacties.txt");
    if(!res.ok) throw new Error("Geen reacties");
    const text=await res.text();

    qaDatabase=text.split(/\r?\n/).map(line=>{
      const i=line.indexOf("=");
      if(i<0) return null;
      const question=line.slice(0,i).trim();
      const answer=line.slice(i+1).trim();
      if(!question||!answer) return null;
      return {vraag:question.toLowerCase(),antwoord:answer};
    }).filter(Boolean);
  }catch(e){
    console.warn("reacties.txt niet geladen:",e);
    qaDatabase=[];
  }
}

/* ---------- MATCHING ---------- */

const stopWords=new Set([
  "de","het","een","ik","je","jij","we","wij","ze","zij","mij","me",
  "is","was","zijn","ben","heb","heeft","had","do","does","did","en","of",
  "maar","dat","dit","wat","hoe","waar","wie","aan","in","op","voor","van",
  "met","naar","the","a","an","and","or","are","you","i","it","to","please","can"
]);

function normalize(s){
  return String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
}
function words(s){
  return normalize(s).split(" ").filter(w=>w.length>1&&!stopWords.has(w));
}
function score(a,b){
  a=normalize(a);b=normalize(b);
  if(!a||!b)return 0;
  if(a===b)return 1;
  const aw=words(a),bw=words(b);
  if(!aw.length||!bw.length)return 0;
  const set=new Set(bw);
  const common=aw.filter(w=>set.has(w)).length;
  let value=(common/Math.max(aw.length,bw.length))*.8;
  if(a.includes(b)||b.includes(a))value+=.25;
  aw.forEach(w=>{if(bw.some(x=>x!==w&&(x.includes(w)||w.includes(x))))value+=.15;});
  return Math.min(1,value);
}
function bestMatch(db,text){
  let best=null,highest=0;
  for(const item of db){
    const s=score(text,item.vraag);
    if(s>highest){highest=s;best=item;}
  }
  return {match:best,score:highest};
}

/* ---------- ANSWER ENGINE ---------- */

async function getAnswer(text){
  const analysis=[
    {text:"Zoeken in geleerde kennis",ok:true},
    {text:"Zoeken in reacties.txt",ok:qaDatabase.length>0}
  ];

  const learned=bestMatch(data.learned,text);
  const base=bestMatch(qaDatabase,text);

  let match=null,scoreValue=0;
  if(learned.match && learned.score>scoreValue){
    match=learned.match;scoreValue=learned.score;
  }
  if(base.match && base.score>scoreValue){
    match=base.match;scoreValue=base.score;
  }

  if(match && scoreValue>=.38){
    analysis.push({text:"Een mogelijke match gevonden ("+Math.round(scoreValue*100)+"%)",ok:true});

    if(scoreValue<.55){
      return {
        answer:"Ik heb iets gevonden dat misschien bij je vraag past:\n\n"+
          match.antwoord+"\n\nIs dit wat je bedoelde?",
        analysis
      };
    }
    return {answer:match.antwoord,analysis};
  }

  analysis.push({text:"Geen passende match gevonden",ok:false});
  return {
    answer:"Ik weet nog niet precies hoe ik hierop moet antwoorden. Mijn opgeslagen kennis bevat geen goede match. Je kunt je vraag anders formuleren of mijn kennis uitbreiden.",
    analysis
  };
}

/* ---------- LEARNING ---------- */
/* Nexi leert stilletjes uit vervolgcorrecties/antwoorden.
   Geen melding wordt meer aan het gesprek toegevoegd. */

function learn(previousBotText,userText){
  if(!previousBotText||!userText)return false;

  const question=normalize(previousBotText);
  if(question.length<4)return false;

  if(data.learned.some(x=>normalize(x.vraag)===question))return false;
  if(qaDatabase.some(x=>normalize(x.vraag)===question))return false;

  data.learned.push({
    vraag:question,
    antwoord:userText.trim(),
    time:Date.now()
  });
  save();
  return true;
}

/* ---------- SEND ---------- */

async function sendMessage(){
  if(thinking)return;
  const text=input.value.trim();
  if(!text)return;

  if(!currentChatId) createChat("Nieuwe chat");
  const chat=currentChat();
  if(!chat)return;

  const previousBot=[...chat.messages].reverse().find(m=>m.role==="bot");

  addMessage("user",text);
  input.value="";
  resizeInput();
  send.disabled=true;
  thinking=true;

  const typing=showThinking();
  await new Promise(r=>setTimeout(r,300));

  try{
    const response=await getAnswer(text);
    typing.remove();

    if(previousBot) learn(previousBot.text,text);

    // Geen automatische kennis-melding meer!
    addMessage("bot",response.answer,response.analysis);
  }catch(e){
    typing.remove();
    addMessage("bot","Er ging iets mis. Probeer het opnieuw.");
    console.error(e);
  }finally{
    thinking=false;
    send.disabled=false;
    input.focus();
  }
}

/* ======================================================
   CENTRAAL TXT BACKUP — EXPORT / IMPORT
====================================================== */

/*
   nex i.txt bevat de volledige app-data in JSON-formaat.
   JSON is bewust gekozen zodat alle chats, berichten, tijden
   en geleerde kennis betrouwbaar terug te laden zijn.
*/

function exportAll(){
  const backup={
    marker:BACKUP_MARKER,
    version:1,
    exportedAt:new Date().toISOString(),
    chats:data.chats,
    learned:data.learned
  };

  const contents=
    "NEXI BACKUP FILE\n"+
    "Dit bestand bevat chats en geleerde kennis van Nexi.\n"+
    "Verander de gegevens hieronder bij voorkeur niet handmatig.\n\n"+
    JSON.stringify(backup,null,2);

  download("nexi.txt",contents);
  toast("Nexi.txt is geëxporteerd");
}

function exportChat(chatId){
  const chat=data.chats.find(c=>c.id===chatId);
  if(!chat)return;

  const backup={
    marker:"NEXI SINGLE CHAT",
    version:1,
    chat
  };

  download(safeFilename(chat.title)+".txt",
    "NEXI SINGLE CHAT\n\n"+JSON.stringify(backup,null,2));
  toast("Chat geëxporteerd");
}

function download(filename,text){
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);
  a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importBackupFile(file){
  if(!file)return;

  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const raw=String(reader.result);
      const start=raw.indexOf("{");
      if(start<0)throw new Error("Geen JSON gevonden");

      const parsed=JSON.parse(raw.slice(start));

      // Full backup
      if(parsed.marker===BACKUP_MARKER){
        if(!Array.isArray(parsed.chats)||!Array.isArray(parsed.learned)){
          throw new Error("Backup mist chats of kennis");
        }

        if(!confirm(
          "Deze import vervangt je huidige chats en geleerde kennis.\n\n"+
          "Doorgaan?"
        ))return;

        data={
          version:1,
          chats:parsed.chats,
          learned:parsed.learned
        };
        save();

        currentChatId=data.chats[0]?.id||null;
        if(!currentChatId)createChat("Nieuwe chat");
        renderChats();renderMessages();updateHeader();
        toast("Nexi backup volledig geladen");
        return;
      }

      // Single chat import
      if(parsed.marker==="NEXI SINGLE CHAT" && parsed.chat){
        const chat=parsed.chat;
        if(!Array.isArray(chat.messages))chat.messages=[];
        chat.id=id();
        data.chats.unshift(chat);
        currentChatId=chat.id;
        save();renderChats();renderMessages();updateHeader();
        toast("Chat geïmporteerd");
        return;
      }

      throw new Error("Dit is geen geldig Nexi-backupbestand");
    }catch(e){
      alert("Importeren mislukt:\n"+e.message);
    }
  };
  reader.readAsText(file);
}

  $("modalRoot").innerHTML=`
    <div class="backdrop">

        <h3>Nexi instellingen</h3>
        <p>Beheer je chats en centrale backupbestand.</p>
        <div class="settings-buttons">
          <button class="btn" id="backupExport">↓ &nbsp; Alles exporteren als nexi.txt</button>
          <button class="btn" id="backupImport">↑ &nbsp; Backupbestand importeren</button>
          <button class="btn" id="learnExport">↓ &nbsp; Alleen kennis exporteren</button>
          <button class="btn danger" id="clearLearned">⌫ &nbsp; Geleerde kennis wissen</button>
          <button class="btn danger" id="clearChats">⌫ &nbsp; Alle chats verwijderen</button>
        </div>
        <div class="actions"><button class="btn primary" id="closeSettings">Sluiten</button></div>
      </div>
    </div>`;

  $("closeSettings").onclick=()=> $("modalRoot").innerHTML="";
  $("backupExport").onclick=()=>{exportAll();$("modalRoot").innerHTML="";};
  $("backupImport").onclick=()=>{
    $("modalRoot").innerHTML="";
    $("backupInput").click();
  };
  $("learnExport").onclick=()=>{exportKnowledge();$("modalRoot").innerHTML="";};
  $("clearLearned").onclick=()=>{
    if(confirm("Alle geleerde kennis verwijderen?")){
      data.learned=[];save();toast("Kennis verwijderd");
    }
  };
  $("clearChats").onclick=()=>{
    if(confirm("Alle chats verwijderen?")){
      data.chats=[];currentChatId=null;
      createChat("Nieuwe chat");
      toast("Chats verwijderd");

  };
}

function exportKnowledge(){
  const text="NEXI KNOWLEDGE ONLY\n\n"+JSON.stringify(data.learned,null,2);
  download("nexi-kennis.txt",text);
}

/* ---------- THEME ---------- */

function toggleTheme(){
  const current=document.documentElement.getAttribute("data-theme")||"light";
  const next=current==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem(THEME_KEY,next);
}

function loadTheme(){
  const saved=localStorage.getItem(THEME_KEY);
  if(saved)document.documentElement.setAttribute("data-theme",saved);
}

/* ---------- MOBILE SIDEBAR ---------- */

function openSidebar(){
  $("sidebar").classList.add("open");
  $("overlay").classList.remove("hidden");
}
function closeSidebar(){
  $("sidebar").classList.remove("open");
  $("overlay").classList.add("hidden");
}

/* ---------- TEXTAREA ---------- */

function resizeInput(){
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,150)+"px";
}

/* ---------- EXPORT CURRENT CHAT ---------- */

function exportCurrent(){
  if(currentChatId)exportChat(currentChatId);
}

/* ---------- EVENTS ---------- */

$("newChat").onclick=()=>createChat();
$("renameCurrent").onclick=()=>currentChatId&&renameChat(currentChatId);
$("theme").onclick=toggleTheme;
$("settings").onclick=settings;
$("mobileMenu").onclick=openSidebar;
$("overlay").onclick=closeSidebar;
$("exportChat").onclick=exportCurrent;
$("analysisToggle").onclick=()=>{
  analysisMode=!analysisMode;
  $("analysisToggle").textContent=analysisMode?"✓ Analyse":"⌘ Analyse";
  renderMessages();
  toast(analysisMode?"Analyse ingeschakeld":"Analyse uitgeschakeld");
};

$("search").oninput=renderChats;
send.onclick=sendMessage;
input.oninput=resizeInput;
input.onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
};

$("backupInput").onchange=e=>{
  importBackupFile(e.target.files[0]);
  e.target.value="";
};

/* ---------- INITIALIZE ---------- */

async function init(){
  loadTheme();

  try{
    const stored=JSON.parse(localStorage.getItem(STORAGE)||"null");
    if(stored && Array.isArray(stored.chats) && Array.isArray(stored.learned)){
      data=stored;
    }
  }catch(e){
    console.warn("Lokale data kon niet gelezen worden",e);
  }

  await loadResponses();

  if(!data.chats.length){
    createChat("Nieuwe chat");
  }else{
    currentChatId=data.chats[0].id;
    renderChats();renderMessages();updateHeader();
  }
  resizeInput();
}

init();
</script>
