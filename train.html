<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexi</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f3f4f7;--panel:#ffffff;--soft:#f3f4f7;--text:#111827;
  --muted:#6b7280;--border:#e5e7eb;--accent:#2457f5;
  --accentSoft:#e8eeff;--bot:#ffffff;--danger:#e05b5b;
  --glow:radial-gradient(ellipse 62% 340px at 50% 0, rgba(250,214,170,.85) 0, rgba(250,214,170,.35) 45%, rgba(250,214,170,0) 100%);
  --shadow:0 10px 30px rgba(17,24,39,.08);
}
[data-theme="dark"]{
  --bg:#12141a;--panel:#1b1e26;--soft:#252932;--text:#f3f4f6;
  --muted:#9aa1ae;--border:#313541;--accent:#6b8bff;
  --accentSoft:#252d4d;--bot:#1b1e26;--danger:#ff7777;
  --glow:radial-gradient(ellipse 62% 340px at 50% 0, rgba(255,160,90,.26) 0, rgba(255,160,90,.1) 45%, rgba(255,160,90,0) 100%);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);background:var(--bg);height:100dvh;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;width:100%;height:100dvh;overflow:hidden}

/* SIDEBAR (vaste chatlijst op desktop, uitschuifpaneel op mobiel) */
.sidebar{
  width:280px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  padding:17px 13px;z-index:15
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand img{width:40px;height:40px;object-fit:cover;border-radius:50%}
.brand-name{font-family:"Inter Tight","Inter",sans-serif;font-size:22px;font-weight:800;letter-spacing:-.04em}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.new-chat{
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  padding:12px 14px;border-radius:999px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px
}
.new-chat:hover{background:var(--accentSoft);border-color:var(--accent)}
.new-chat span{font-size:20px;color:var(--accent);line-height:1}
.search{position:relative;margin:14px 0}
.search input{
  width:100%;border:1px solid transparent;border-radius:999px;
  background:var(--soft);padding:10px 14px 10px 36px;
  outline:none;color:var(--text);font-size:13px
}
.search input:focus{border-color:var(--accent);background:var(--panel)}
.search span{position:absolute;left:14px;top:9px;color:var(--muted)}
.label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.7px;padding:0 8px 9px}
.chat-list{flex:1;overflow-y:auto;min-height:0}
.chat-item{display:flex;align-items:center;gap:9px;padding:10px;border-radius:14px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
.chat-item:hover{background:var(--soft)}
.chat-item.active{background:var(--accentSoft);border-color:rgba(36,87,245,.18)}
.chat-icon{width:33px;height:33px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.chat-item.active .chat-icon{background:var(--panel);color:var(--accent)}
.chat-info{flex:1;min-width:0}
.chat-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-preview{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{border:0;background:transparent;color:var(--muted);padding:5px;border-radius:7px;opacity:0}
.chat-item:hover .more,.chat-item.active .more{opacity:1}
.more:hover{background:var(--border)}
.sidebar-bottom{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.bottom-row{display:flex;align-items:center;gap:6px;padding:5px}
.profile{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.profile-avatar{width:34px;height:34px;border-radius:50%;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.profile-name{font-size:13px;font-weight:600}
.profile-sub{font-size:11px;color:var(--muted);margin-top:2px}
.icon-btn{border:0;background:transparent;color:var(--muted);border-radius:50%;width:36px;height:36px;font-size:15px}
.icon-btn:hover{background:var(--soft);color:var(--text)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}
.main::before{content:"";position:absolute;inset:0 0 auto 0;height:420px;background:var(--glow);pointer-events:none;z-index:0}
.main > *{position:relative;z-index:1}
.topbar{
  height:62px;min-height:62px;display:flex;align-items:center;
  padding:0 20px;gap:6px
}
.mobile-menu{display:none}
.header-title{font-size:14px;font-weight:600;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{display:none}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--border);margin-right:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#48c58b}

/* CHAT */
.messages{flex:1;overflow-y:auto;padding:10px 20px 26px;scroll-behavior:smooth;min-height:0}
.message-container{max-width:820px;margin:auto;display:flex;flex-direction:column;gap:20px}
.message{display:flex;align-items:flex-start;gap:11px;animation:fade .15s ease}
.message.user{flex-direction:row-reverse}
.avatar{
  width:34px;height:34px;flex-shrink:0;border-radius:50%;
  background:var(--panel);border:1px solid var(--border);
  display:grid;place-items:center;overflow:hidden;font-size:13px;font-weight:600
}
.avatar img{width:100%;height:100%;object-fit:cover}
.body{max-width:min(78%,650px)}
.message.user .body{display:flex;flex-direction:column;align-items:flex-end}
.name{font-size:11px;font-weight:600;color:var(--muted);margin:0 4px 6px}
.bubble{
  border-radius:20px;padding:12px 16px;line-height:1.6;font-size:14px;
  white-space:pre-wrap;overflow-wrap:anywhere
}
.bot .bubble{background:var(--bot);border:1px solid var(--border);border-top-left-radius:6px;box-shadow:0 2px 10px rgba(17,24,39,.04)}
.user .bubble{background:var(--accent);color:#fff;border-top-right-radius:6px}
.bubble img{max-width:100%;max-height:350px;border-radius:12px;margin-top:8px;display:block}
.analysis{
  margin-top:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:11px 13px;font-size:12px;color:var(--muted)
}
.analysis strong{display:block;color:var(--text);margin-bottom:7px}
.analysis div{margin-top:5px}
.thinking .bubble{color:var(--muted)}
.dots{display:inline-flex;gap:4px;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}

/* MESSAGE ACTIONS */
.msg-actions{display:flex;gap:2px;margin-top:6px;opacity:0;transition:opacity .15s}
.message:hover .msg-actions,.message:focus-within .msg-actions{opacity:1}
.msg-actions button{
  border:0;background:transparent;color:var(--muted);
  padding:5px 9px;border-radius:999px;font-size:14px;line-height:1;
}
.msg-actions button:hover{background:var(--panel);color:var(--text)}

/* SYSTEM MESSAGE */
.system-msg{
  align-self:center;text-align:center;font-size:12px;color:var(--muted);
  padding:8px 16px;white-space:pre-wrap;line-height:1.6;max-width:600px;
  font-style:italic;background:var(--panel);border:1px solid var(--border);border-radius:16px
}

/* JUMP TO BOTTOM */
.jump-bottom{
  position:absolute;right:22px;bottom:130px;width:38px;height:38px;
  border-radius:50%;border:1px solid var(--border);background:var(--panel);
  color:var(--muted);display:grid;place-items:center;
  box-shadow:var(--shadow);z-index:10;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.jump-bottom.visible{opacity:1;pointer-events:auto}
.jump-bottom:hover{color:var(--text);background:var(--soft)}

/* INPUT */
.composer-wrap{padding:8px 20px 16px;width:100%}
.composer{
  display:flex;align-items:flex-end;gap:6px;
  max-width:820px;margin:auto;background:var(--panel);border:1px solid var(--border);
  border-radius:28px;padding:4px 6px 4px 20px;box-shadow:var(--shadow)
}
.composer:focus-within{border-color:var(--accent)}
textarea{
  flex:1;display:block;min-width:0;resize:none;max-height:150px;min-height:44px;
  padding:12px 4px 10px;border:0;outline:0;background:transparent;
  color:var(--text);font-size:15px;line-height:1.45
}
textarea::placeholder{color:var(--muted)}
.send{
  width:40px;height:40px;margin:2px 0;flex-shrink:0;border:0;border-radius:50%;
  background:var(--accent);color:white;font-size:18px
}
.send:hover{filter:brightness(1.1)}
.send:disabled{opacity:.4}
.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;max-width:820px;margin:10px auto 0}
.tool{
  border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:6px 13px;
  border-radius:999px;font-size:12px;font-weight:500
}
.tool:hover{color:var(--text);border-color:var(--accent)}
.disclaimer{max-width:820px;margin:10px auto 0;text-align:center;color:var(--muted);font-size:11px}

/* LEGE STAAT = begroeting */
.main.empty-state .messages{display:flex}
.main.empty-state .message-container{max-width:none;width:100%;margin:0;flex:1}
.main.empty-state .jump-bottom{display:none}
.empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;padding:9vh 20px 30px;min-height:0
}
.empty h1{
  font-family:"Inter Tight","Inter",sans-serif;
  font-size:clamp(38px,7.2vw,92px);font-weight:800;letter-spacing:-.05em;line-height:1.02;color:var(--text)
}
.when{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.when .date{font-size:clamp(15px,1.6vw,20px);color:var(--muted);font-weight:500}
.when .clock{
  background:var(--panel);border:1px solid var(--border);border-radius:999px;
  padding:9px 22px;font-size:clamp(15px,1.5vw,19px);font-weight:800;letter-spacing:.1em;
  font-variant-numeric:tabular-nums;color:var(--text)
}
.empty .composer-wrap{padding:0;margin-top:44px;max-width:700px}
.empty .composer{max-width:700px;min-height:56px}
.empty .tools,.empty .disclaimer{max-width:700px}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px;max-width:720px}
.suggestion{
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500
}
.suggestion:hover{background:var(--accentSoft);border-color:var(--accent)}

/* MENU / TOAST */
.menu{
  position:fixed;z-index:20;width:170px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;padding:5px;
  box-shadow:0 8px 30px rgba(0,0,0,.14)
}
.menu button{
  display:block;width:100%;text-align:left;padding:10px;border:0;
  background:transparent;color:var(--text);border-radius:9px;font-size:12px
}
.menu button:hover{background:var(--soft)}
.menu .delete{color:var(--danger)}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--panel);padding:11px 18px;
  border-radius:999px;font-size:12px;z-index:40;animation:fade .15s
}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#0005;z-index:14}

/* MODAL */
.backdrop{position:fixed;inset:0;z-index:30;background:#0005;display:grid;place-items:center;padding:20px}
.modal{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:22px}
.modal h3{font-size:18px;margin-bottom:8px;font-family:"Inter Tight","Inter",sans-serif;letter-spacing:-.02em}
.modal p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:15px}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{padding:10px 15px;border-radius:999px;border:1px solid var(--border);background:var(--soft);color:var(--text);font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.danger{color:var(--danger)}
.settings-buttons{display:flex;flex-direction:column;gap:9px;margin-bottom:17px}
.settings-buttons .btn{text-align:left}
.kb-list{max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.kb-item{border:1px solid var(--border);border-radius:14px;padding:10px}
.kb-q{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}
.kb-a{font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap}

/* SCROLLBARS */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

@media(min-width:861px){ .overlay{display:none!important} }
@media(max-width:860px){
  .sidebar{position:fixed;inset:0 auto 0 0;width:290px;transform:translateX(-100%);transition:transform .22s ease}
  .sidebar.open{transform:translateX(0);box-shadow:10px 0 40px #0003}
  .mobile-menu{display:block}
  .topbar{height:56px;min-height:56px;padding:0 10px}
  .messages{padding:8px 12px 19px}
  .body{max-width:88%}
  .composer-wrap{padding:6px 10px 12px}
  .status{font-size:0;padding:7px}
  .empty{padding-top:7vh}
  .empty .composer-wrap{margin-top:30px}
  .jump-bottom{right:14px;bottom:150px}
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="logo.png" alt="Nexi" onerror="this.style.display='none'">
      <div>
        <div class="brand-name">Nexi</div>
        <div class="brand-sub">Jouw chatomgeving</div>
      </div>
    </div>

    <button class="new-chat" id="newChat"><span>＋</span> Nieuwe chat</button>

    <div class="search">
      <span>⌕</span>
      <input id="search" placeholder="Zoek chats..." type="search">
    </div>

    <div class="label">GESPREKKEN</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      <div class="bottom-row">
        <div class="profile">
          <div class="profile-avatar" id="profileAvatar">N</div>
          <div>
            <div class="profile-sub">Lokale opslag</div>
          </div>
        </div>
        <button class="icon-btn" id="theme" title="Thema">◐</button>
        <button class="icon-btn" id="settings" title="Instellingen">⚙</button>
      </div>
    </div>
  </aside>

  <main class="main" id="mainEl">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenu" title="Gesprekken">☰</button>
      <div>
        <div class="header-title" id="headerTitle">Nexi</div>
        <div class="header-sub">Gesprek met Nexi</div>
      </div>
      <div class="spacer"></div>
      <div class="status"><span class="dot"></span> Beschikbaar</div>
      <button class="icon-btn" id="tabNew" title="Nieuwe chat">＋</button>
      <button class="icon-btn" id="tabKnowledge" title="Geleerde kennis">📚</button>
      <button class="icon-btn" id="renameCurrent" title="Chat hernoemen">✎</button>
    </header>

    <section class="messages" id="messages">
      <div class="message-container" id="messageContainer"></div>
    </section>

    <button class="jump-bottom" id="jumpBottom" title="Naar beneden">↓</button>

    <div class="composer-wrap" id="composerWrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Typ een bericht aan Nexi..."></textarea>
        <button class="send" id="send" title="Versturen">↑</button>
      </div>
      <div class="tools">
        <button class="tool" id="analysisToggle">⌘ Analyse</button>
        <button class="tool" id="exportChat">↓ Chat exporteren</button>
      </div>
      <div class="disclaimer">Nexi leert van elk antwoord dat jij geeft. Typ <b>/help</b> voor commando's.</div>
    </div>
  </main>
</div>

<div id="overlay" class="overlay hidden"></div>
<div id="modalRoot"></div>
<div id="menu" class="menu hidden"></div>
<div id="toastRoot"></div>
<input type="file" id="backupInput" accept=".txt,text/plain" hidden>

<script>
/* ======================================================
   NEXI — vloeiende lerende versie
====================================================== */

const STORAGE = "nexi_data_v3";
const THEME_KEY = "nexi_theme";
const NAME_KEY = "nexi_username";
const BACKUP_MARKER = "NEXI BACKUP FILE";

/* Alles onder deze drempel = "weet ik niet" */
const UNKNOWN_BELOW = 0.35;

let data = { version:1, chats:[], learned:[] };
let currentChatId = null;
let qaDatabase = [];
let analysisMode = false;
let thinking = false;
let menuChatId = null;
let userName = "Gebruiker";

/* Onthoudt de laatste onbeantwoorde vraag → volgende bericht wordt geleerd */
let pendingLearn = null;

const $ = id => document.getElementById(id);
const chatList = $("chatList");
const messageContainer = $("messageContainer");
const messages = $("messages");
const input = $("input");
const send = $("send");
const jumpBottom = $("jumpBottom");
const mainEl = $("mainEl");
const composerWrap = $("composerWrap");

/* ---------- HELPERS ---------- */

function id(){ return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }
function currentChat(){ return data.chats.find(c => c.id === currentChatId) || null; }
function escapeHTML(s){
  return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function save(){
  try{ localStorage.setItem(STORAGE, JSON.stringify(data)); }
  catch(e){ toast("Opslaan mislukt — opslag mogelijk vol."); }
}
function toast(message){
  $("toastRoot").innerHTML = "";
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = message;
  $("toastRoot").appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function time(t){ return new Date(t).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}); }
function safeFilename(s){ return String(s).replace(/[\\/:*?"<>|]/g,"_").slice(0,80) || "chat"; }
function truncate(s, n){
  s = String(s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

/* ======================================================
   BEGROETING + KLOK
====================================================== */

function greeting(){
  const h = new Date().getHours();
  if(h < 6)  return "Goedenacht";
  if(h < 12) return "Goedemorgen";
  if(h < 18) return "Goedemiddag";
  return "Goedenavond";
}

function updateClock(){
  const now = new Date();
  const dateEl = document.querySelector(".when .date");
  const clockEl = document.querySelector(".when .clock");
  const greetEl = document.querySelector(".empty h1 .greet");
  if(dateEl){
    const d = now.toLocaleDateString("nl-NL",{ weekday:"long", day:"numeric", month:"long" });
    dateEl.textContent = d.charAt(0).toUpperCase() + d.slice(1);
  }
  if(clockEl) clockEl.textContent = now.toLocaleTimeString("nl-NL",{ hour:"2-digit", minute:"2-digit" });
  if(greetEl) greetEl.textContent = greeting();
}

function applyUserName(){
  // Geen persoonlijke naam meer in de interface
  if($("profileAvatar")) $("profileAvatar").textContent = "N";
}

function changeName(){
  const n = prompt("Hoe moet ik je noemen?", userName);
  if(n === null) return;
  userName = n.trim().slice(0, 30) || "Gebruiker";
  try{ localStorage.setItem(NAME_KEY, userName); }catch{}
  applyUserName();
  toast("Naam opgeslagen");
}

/* ======================================================
   TEKST-FORMATTERING (hoofdletter + eindpunt)
====================================================== */

function formatAnswer(text){
  let t = String(text ?? "").trim();
  if(!t) return "";
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if(!/[.!?…]$/.test(t)) t += ".";
  return t;
}

/* ======================================================
   NORMALISATIE + MATCHING
====================================================== */

function normalize(s){
  return String(s ?? "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .replace(/\s+/g," ")
    .trim();
}

const STOPWORDS = new Set([
  "de","het","een","ik","je","jij","we","wij","ze","zij","mij","me",
  "is","was","zijn","ben","heb","heeft","had","do","does","did","en","of",
  "maar","dat","dit","wat","hoe","waar","wie","aan","in","op","voor","van",
  "met","naar","the","a","an","and","or","are","you","i","it","to","please",
  "can","could","would","should","will","shall","my","your","our","their"
]);

function tokenize(s){
  return normalize(s).split(" ").filter(w => w.length>1 && !STOPWORDS.has(w));
}

function levenshtein(a,b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp=new Array(n+1);
  for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){
    let prev=dp[0];
    dp[0]=i;
    for(let j=1;j<=n;j++){
      const tmp=dp[j];
      dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+(a[i-1]===b[j-1]?0:1));
      prev=tmp;
    }
  }
  return dp[n];
}
function similarity(a,b){
  if(!a||!b) return 0;
  if(a===b) return 1;
  return 1 - levenshtein(a,b)/Math.max(a.length,b.length);
}
function diceBigrams(a,b){
  if(a.length<2||b.length<2) return a===b?1:0;
  const A=new Set(), B=new Set();
  for(let i=0;i<a.length-1;i++) A.add(a.slice(i,i+2));
  for(let i=0;i<b.length-1;i++) B.add(b.slice(i,i+2));
  let inter=0;
  for(const g of A) if(B.has(g)) inter++;
  return 2*inter/(A.size+B.size);
}

function score(query, target){
  const q = normalize(query);
  const t = normalize(target);
  if(!q||!t) return 0;
  if(q===t) return 1;

  const qw = tokenize(q);
  const tw = tokenize(t);
  if(!qw.length || !tw.length) return 0;

  const tSet = new Set(tw);
  let exact = 0, fuzzy = 0;
  for(const w of qw){
    if(tSet.has(w)){ exact++; continue; }
    let best = 0;
    for(const tw2 of tw){
      const s = similarity(w, tw2);
      if(s>best) best = s;
    }
    if(best >= 0.82) fuzzy += best;
  }

  const tokenScore = (exact + fuzzy * 0.85) / Math.max(qw.length, tw.length);
  const bg = diceBigrams(q, t);

  let s = 0.60 * tokenScore + 0.35 * bg;
  if(exact === qw.length && qw.length >= 2) s += 0.10;
  if(t.includes(q) || q.includes(t)) s += 0.12;

  return Math.min(1, s);
}

function bestMatch(db, text){
  let best=null, highest=0;
  for(const item of db){
    const s = score(text, item.vraag);
    if(s > highest){ highest = s; best = item; }
  }
  return { match:best, score:highest };
}

function looksLikeQuestion(text){
  const t = String(text).trim().toLowerCase();
  if(!t) return false;
  if(t.endsWith("?")) return true;
  return /^(wat|hoe|waar|wanneer|waarom|wie|welke|wiens|is|kan|kun|kun\s+je|kan\s+je|heb|heeft|heb\s+je|doet|denk|vind|wil|mag|moet)\b/i.test(t);
}

const SKIP_LEARN = new Set([
  "ja","nee","ok","oke","oké","okee","dank","thanks","thank you","bedankt",
  "yes","no","tuurlijk","zeker","goed","prima","top","nice","cool","leuk",
  "haha","lol","hm","hmm","mhm","uh","uhu","ah","oh","oké dan","prima hoor"
]);

====================================================== */

function createChat(name){
  const chat = {
    id: id(),
    title: name || "Nieuwe chat",
    created: Date.now(),
    updated: Date.now(),
    messages: []
  };
  data.chats.unshift(chat);
  currentChatId = chat.id;
  pendingLearn = null;
  save(); renderChats(); renderMessages(); updateHeader(); closeSidebar();
  input.focus();
  return chat;
}

function switchChat(chatId){
  currentChatId = chatId;
  pendingLearn = null;
  renderChats(); renderMessages(); updateHeader(); closeSidebar();
  input.focus();
}

function renameChat(chatId){
  const chat = data.chats.find(c => c.id === chatId);
  if(!chat) return;
  const name = prompt("Naam van de chat:", chat.title);
  if(name === null) return;
  chat.title = name.trim() || "Nieuwe chat";
  chat.updated = Date.now();
  save(); renderChats(); updateHeader();
}

function deleteChat(chatId){
  const chat = data.chats.find(c => c.id === chatId);
  if(!chat) return;
  if(!confirm(`Chat "${chat.title}" verwijderen?`)) return;

  data.chats = data.chats.filter(c => c.id !== chatId);
  if(currentChatId === chatId) currentChatId = data.chats[0]?.id || null;
  save();

  if(!currentChatId) createChat("Nieuwe chat");
  else { renderChats(); renderMessages(); updateHeader(); }
}

function renderChats(){
  const query = $("search").value.toLowerCase().trim();
  chatList.innerHTML = "";

  data.chats.filter(c => {
    const last = c.messages?.at(-1)?.text || "";
    return c.title.toLowerCase().includes(query) || last.toLowerCase().includes(query);
  }).forEach(chat => {
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === currentChatId ? " active" : "");

    const icon = document.createElement("div");
    icon.className = "chat-icon"; icon.textContent = "▤";

    const info = document.createElement("div");
    info.className = "chat-info";

    const title = document.createElement("div");
    title.className = "chat-title"; title.textContent = chat.title;

    const preview = document.createElement("div");
    preview.className = "chat-preview";
    preview.textContent = chat.messages?.at(-1)?.text || "Nog geen berichten";

    info.append(title, preview);

    const more = document.createElement("button");
    more.className = "more"; more.textContent = "⋯";
    more.onclick = e => { e.stopPropagation(); showMenu(chat.id, more); };

    item.append(icon, info, more);
    item.onclick = () => switchChat(chat.id);
    chatList.appendChild(item);
  });
}

function updateHeader(){
  const chat = currentChat();
  $("headerTitle").textContent = chat && chat.messages.length ? chat.title : "Nexi";
}

function renderTextSafely(container, text){
  const regex = /(https?:\/\/[^\s<]+?\.(?:png|jpe?g|gif|webp|svg)(?:\?[^\s<]*)?)/gi;
  const parts = String(text).split(regex);
  parts.forEach(part => {
    if(!part) return;
    if(/^https?:\/\/.+\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(part)){
      const img = document.createElement("img");
      img.src = part; img.alt = "Afbeelding"; img.loading = "lazy";
      img.onerror = () => img.remove();
      container.appendChild(img);
    } else {
      container.appendChild(document.createTextNode(part));
    }
  });
}

   REACTIES.TXT
====================================================== */

async function loadResponses(){
  try{
    const res = await fetch("https://raw.githubusercontent.com/jimisdebest/nexi/main/reacties.txt");
    if(!res.ok) throw new Error("Geen reacties");
    const text = await res.text();

    qaDatabase = text.split(/\r?\n/).map(line => {
      const i = line.indexOf("=");
      if(i < 0) return null;
      const vraag = line.slice(0, i).trim();
      const antwoord = line.slice(i + 1).trim();
      if(!vraag || !antwoord) return null;
      return { vraag, antwoord };
    }).filter(Boolean);
  }catch(e){
    console.warn("reacties.txt niet geladen:", e);
    qaDatabase = [];
  }
}

/* ======================================================
   ANSWER ENGINE
====================================================== */

async function getAnswer(text){
  /* Meta-antwoorden */
  for(const meta of metaAnswers){
    if(meta.patterns.some(p => p.test(text))){
      return {
        answer: meta.answer,
        analysis: [{ text:"Meta-vraag herkend", ok:true }],
        matched: true
      };
    }
  }

  const analysis = [
    { text:`Geleerde kennis (${data.learned.length} items)`, ok:true },
    { text:`reacties.txt (${qaDatabase.length} items)`, ok:qaDatabase.length > 0 }
  ];

  const learned = bestMatch(data.learned, text);
  const base    = bestMatch(qaDatabase, text);

  let match = null, best = 0, source = "";

  if(learned.match && learned.score > best){
    match = learned.match; best = learned.score; source = "geleerde kennis";
  }
  if(base.match && base.score > best){
    match = base.match; best = base.score; source = "reacties.txt";
  }

  if(match && best >= UNKNOWN_BELOW){
    analysis.push({
      text:`Match (${Math.round(best * 100)}%) uit ${source}`,
      ok:true
    });
    return { answer: match.antwoord, analysis, matched: true };
  }

  analysis.push({ text:"Geen passende match gevonden", ok:false });
  return {
    answer: "Dat weet ik nog niet — typ het antwoord maar, dan onthoud ik het.",
    analysis,
    matched: false
  };
}

/* ======================================================
   LEREN / VERGETEN
====================================================== */

function learnFromPair(vraag, antwoord){
  vraag = String(vraag || "").trim();
  antwoord = String(antwoord || "").trim();
  if(!vraag || !antwoord) return false;

  const nq = normalize(vraag);
  if(nq.length < 3) return false;

  const formattedQ = formatAnswer(vraag);
  const formattedA = formatAnswer(antwoord);

  data.learned = data.learned.filter(x => normalize(x.vraag) !== nq);
  data.learned.push({ vraag: formattedQ, antwoord: formattedA, time: Date.now() });
  save();
  return true;
}

function forget(vraag){
  const nq = normalize(vraag);
  const before = data.learned.length;
  data.learned = data.learned.filter(x => normalize(x.vraag) !== nq);
  const changed = data.learned.length !== before;
  if(changed) save();
  return changed;
}

function learnFromBotMessage(botMsg){
  const chat = currentChat();
  if(!chat) return;
  const idx = chat.messages.findIndex(m => m.id === botMsg.id);
  if(idx < 0) return;

  let prevUser = null;
  for(let i = idx - 1; i >= 0; i--){
    if(chat.messages[i].role === "user"){ prevUser = chat.messages[i]; break; }
  }
  if(!prevUser){ toast("Geen voorafgaande vraag gevonden"); return; }

  if(learnFromPair(prevUser.text, botMsg.text)){
    toast("📌 Geleerd");
  } else {
    toast("Kon niet leren");
  }
}

/* ======================================================
   COMMANDO'S
====================================================== */

function parseCommand(text){
  const t = text.trim();
  if(!t.startsWith("/")) return null;

  if(t.startsWith("/leer ")){
    const rest = t.slice(6);
    const m = rest.match(/^(.*?)\s*(?:=>|=|:|\|)\s*([\s\S]+)$/);
    if(!m) return { type:"unknown", hint:"Gebruik: /leer vraag = antwoord" };
    return { type:"learn", vraag:m[1].trim(), antwoord:m[2].trim() };
  }
  if(t.startsWith("/verwijder ")){
    return { type:"forget", vraag:t.slice(11).trim() };
  }
  if(t === "/lijst" || t === "/kennis"){
    return { type:"list" };
  }
  if(t === "/help" || t === "/?"){
    return { type:"help" };
  }
  return { type:"unknown", hint:"Onbekend commando. Typ /help." };
}

function handleCommand(cmd){
  pendingLearn = null;

  if(cmd.type === "learn"){
    if(learnFromPair(cmd.vraag, cmd.antwoord)){
      addSystem(`📌 Geleerd: "${truncate(cmd.vraag, 60)}"`);
      toast("Kennis opgeslagen");
    } else {
      toast("Kon niet leren — vraag en antwoord mogen niet leeg zijn");
    }
    return;
  }
  if(cmd.type === "forget"){
    if(forget(cmd.vraag)){
      addSystem(`🗑️ Vergeten: "${truncate(cmd.vraag, 60)}"`);
      toast("Kennis verwijderd");
    } else {
      toast("Niets gevonden om te vergeten");
    }
    return;
  }
  if(cmd.type === "list"){
    if(!data.learned.length){
      addSystem("📚 Geen geleerde kennis opgeslagen.");
    } else {
      const recent = data.learned.slice(-10).reverse();
      const lines = recent.map((x, i) =>
        `${i + 1}. ${truncate(x.vraag, 60)} → ${truncate(x.antwoord, 80)}`
      );
      addSystem(`📚 Laatste ${recent.length} geleerde items:\n${lines.join("\n")}`);
    }
    return;
  }
  if(cmd.type === "help"){
    addSystem(
      "Nexi commando's:\n" +
      "/leer vraag = antwoord  — iets nieuws leren\n" +
      "/verwijder vraag         — iets vergeten\n" +
      "/lijst                   — geleerde kennis tonen\n" +
      "/help                    — deze uitleg\n\n" +
      "Automatisch leren: als ik iets niet weet, typ je gewoon het antwoord in je volgende bericht."
    );
    return;
  }
  if(cmd.type === "unknown"){
    toast(cmd.hint || "Onbekend commando");
  }
}

/* ======================================================
   SEND / AUTO-LEARN / REGENERATE
====================================================== */

async function sendMessage(){
  if(thinking) return;
  const text = input.value.trim();
  if(!text) return;

  if(!currentChatId) createChat("Nieuwe chat");

  const cmd = parseCommand(text);
  if(cmd){
    input.value = ""; resizeInput();
    handleCommand(cmd);
    return;
  }

  /* ---- AUTO-LEREN: vorige onbeantwoorde vraag + dit bericht = kennis ---- */
  if(pendingLearn && !looksLikeQuestion(text)){
    const lower = text.toLowerCase().trim();
    const tooShort = text.length < 3;
    const trivial = SKIP_LEARN.has(lower);

    if(!tooShort && !trivial){
      const question = pendingLearn.question;
      if(learnFromPair(question, text)){
        addMessage("user", text);
        toast("📌 Geleerd");
        input.value = "";
        resizeInput();
        pendingLearn = null;
        return;
      }
    }
  }

  if(pendingLearn) pendingLearn = null;

  addMessage("user", text);
  autoTitle(text);
  input.value = "";
  resizeInput();
  await runAnswer(text);
}

/* Geef een nieuwe chat automatisch een naam op basis van de eerste vraag */
function autoTitle(text){
  const chat = currentChat();
  if(!chat || chat.title !== "Nieuwe chat") return;
  const userMsgs = chat.messages.filter(m => m.role === "user");
  if(userMsgs.length !== 1) return;
  chat.title = truncate(text.replace(/\s+/g," ").trim(), 40);
  save(); renderChats(); updateHeader();
}

async function runAnswer(userText){
  thinking = true;
  send.disabled = true;
  const typing = showThinking();
  await new Promise(r => setTimeout(r, 250));

  try{
    const response = await getAnswer(userText);
    typing.remove();
    addMessage("bot", response.answer, response.analysis);

    /* Onthoud de vraag als het antwoord onzeker is */
    if(!response.matched){
      pendingLearn = { question: userText, time: Date.now() };
    } else {
      pendingLearn = null;
    }
  }catch(e){
    typing.remove();
    addMessage("bot", "Er ging iets mis. Probeer het opnieuw.");
    console.error(e);
  }finally{
    thinking = false;
    send.disabled = false;
    input.focus();
  }
}

async function regenerateLast(){
  if(thinking) return;
  const chat = currentChat();
  if(!chat) return;

  let lastBotIdx = -1;
  for(let i = chat.messages.length - 1; i >= 0; i--){
    if(chat.messages[i].role === "bot"){ lastBotIdx = i; break; }
  }
  if(lastBotIdx < 0) return;

  let lastUserIdx = -1;
  for(let i = lastBotIdx - 1; i >= 0; i--){
    if(chat.messages[i].role === "user"){ lastUserIdx = i; break; }
  }
  if(lastUserIdx < 0) return;

  const userText = chat.messages[lastUserIdx].text;
  chat.messages.splice(lastBotIdx, 1);
  save(); renderMessages();

  await runAnswer(userText);
}

/* ======================================================
   EXPORT / IMPORT
====================================================== */

function exportAll(){
  const backup = {
    marker: BACKUP_MARKER,
    version: 1,
    exportedAt: new Date().toISOString(),
    chats: data.chats,
    learned: data.learned
  };
  const contents =
    "NEXI BACKUP FILE\n" +
    "Dit bestand bevat chats en geleerde kennis van Nexi.\n" +
    "Verander de gegevens hieronder bij voorkeur niet handmatig.\n\n" +
    JSON.stringify(backup, null, 2);
  download("nexi.txt", contents);
  toast("nexi.txt geëxporteerd");
}

function exportChat(chatId){
  const chat = data.chats.find(c => c.id === chatId);
  if(!chat) return;
  const backup = { marker:"NEXI SINGLE CHAT", version:1, chat };
  download(
    safeFilename(chat.title) + ".txt",
    "NEXI SINGLE CHAT\n\n" + JSON.stringify(backup, null, 2)
  );
  toast("Chat geëxporteerd");
}

function exportKnowledge(){
  const text = "NEXI KNOWLEDGE ONLY\n\n" + JSON.stringify(data.learned, null, 2);
  download("nexi-kennis.txt", text);
  toast("Kennis geëxporteerd");
}

function download(filename, text){
  const blob = new Blob([text], { type:"text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function sanitizeChat(chat){
  if(!chat || typeof chat !== "object") return null;
  return {
    id: String(chat.id || id()),
    title: String(chat.title || "Naamloos").slice(0, 100),
    created: Number(chat.created) || Date.now(),
    updated: Number(chat.updated) || Date.now(),
    messages: (Array.isArray(chat.messages) ? chat.messages : [])
      .map(sanitizeMessage).filter(Boolean)
  };
}

function sanitizeMessage(m){
  if(!m || typeof m !== "object") return null;
  const role = ["user","bot","system"].includes(m.role) ? m.role : "bot";
  return {
    id: String(m.id || id()),
    role,
    text: String(m.text ?? ""),
    time: Number(m.time) || Date.now(),
    analysis: Array.isArray(m.analysis)
      ? m.analysis.map(s => ({ text:String(s?.text ?? ""), ok:!!s?.ok }))
      : null
  };
}

function importBackupFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const raw = String(reader.result);
      const start = raw.indexOf("{");
      if(start < 0) throw new Error("Geen JSON gevonden");
      const parsed = JSON.parse(raw.slice(start));

      if(parsed.marker === BACKUP_MARKER){
        const chats = (Array.isArray(parsed.chats) ? parsed.chats : [])
          .map(sanitizeChat).filter(Boolean);
        const learned = (Array.isArray(parsed.learned) ? parsed.learned : [])
          .filter(x => x && x.vraag && x.antwoord)
          .map(x => ({
            vraag: String(x.vraag),
            antwoord: String(x.antwoord),
            time: Number(x.time) || Date.now()
          }));

        if(!confirm(
          "Deze import vervangt je huidige chats en geleerde kennis.\n\n" +
          `Het bestand bevat ${chats.length} chats en ${learned.length} kennis-items.\n\nDoorgaan?`
        )) return;

        data = { version:1, chats, learned };
        save();
        currentChatId = data.chats[0]?.id || null;
        if(!currentChatId) createChat("Nieuwe chat");
        else { renderChats(); renderMessages(); updateHeader(); }
        toast("Backup volledig geladen");
        return;
      }

      if(parsed.marker === "NEXI SINGLE CHAT" && parsed.chat){
        const chat = sanitizeChat(parsed.chat);
        if(!chat) throw new Error("Chat is ongeldig");
        chat.id = id();
        data.chats.unshift(chat);
        currentChatId = chat.id;
        save(); renderChats(); renderMessages(); updateHeader();
        toast("Chat geïmporteerd");
        return;
      }

      throw new Error("Dit is geen geldig Nexi-backupbestand");
    }catch(e){
      alert("Importeren mislukt:\n" + e.message);
    }
  };
  reader.readAsText(file);
}

function settings(){

  $("modalRoot").innerHTML = `
    <div class="backdrop">
      <div class="modal">
        <h3>Nexi instellingen</h3>
        <p>Beheer je chats, kennis en backups.</p>

          <button class="btn" id="learnExport">↓ &nbsp; Alleen kennis exporteren</button>
          <button class="btn" id="learnView">👁 &nbsp; Geleerde kennis bekijken</button>
          <button class="btn danger" id="clearLearned">⌫ &nbsp; Geleerde kennis wissen</button>
          <button class="btn danger" id="clearChats">⌫ &nbsp; Alle chats verwijderen</button>

  $("learnExport").onclick = () => { exportKnowledge(); $("modalRoot").innerHTML = ""; };
  $("learnView").onclick = showKnowledge;
  $("clearLearned").onclick = () => {
    if(confirm("Alle geleerde kennis verwijderen?")){
      data.learned = []; save(); toast("Kennis verwijderd");
      $("modalRoot").innerHTML = "";
    }
  };
  $("clearChats").onclick = () => {
    if(confirm("Alle chats verwijderen?")){
      data.chats = []; currentChatId = null; pendingLearn = null;
      createChat("Nieuwe chat");
      $("modalRoot").innerHTML = "";
      toast("Chats verwijderd");
    }
  };
}

function showKnowledge(){
  closeSidebar();
  const items = data.learned.slice().reverse();
  const body = items.length
    ? items.map((x, i) => `
        <div class="kb-item">
          <div class="kb-q">${escapeHTML(x.vraag)}</div>
          <div class="kb-a">${escapeHTML(x.antwoord)}</div>
          <button class="btn" data-kb-del="${i}" style="margin-top:8px">⌫ Verwijder</button>
        </div>`).join("")
    : "<p>Geen geleerde kennis opgeslagen.</p>";

  $("modalRoot").innerHTML = `
    <div class="backdrop">
      <div class="modal" style="max-width:560px">
        <h3>Geleerde kennis (${items.length})</h3>
        <div class="kb-list">${body}</div>
        <div class="actions"><button class="btn primary" id="closeKb">Sluiten</button></div>
      </div>
    </div>`;

  $("closeKb").onclick = () => $("modalRoot").innerHTML = "";
  $("modalRoot").querySelectorAll("[data-kb-del]").forEach(b => {
    b.onclick = () => {
      const idx = Number(b.dataset.kbDel);
      const item = items[idx];
      if(item) forget(item.vraag);
      showKnowledge();
    };
  });
}

/* ======================================================
   THEME / SIDEBAR / TEXTAREA
====================================================== */

function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(THEME_KEY, next);
}
function loadTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved) document.documentElement.setAttribute("data-theme", saved);
}
function openSidebar(){
  $("sidebar").classList.add("open");
  $("overlay").classList.remove("hidden");
}
function closeSidebar(){
  $("sidebar").classList.remove("open");
  $("overlay").classList.add("hidden");
}
function resizeInput(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
}

   EVENTS
====================================================== */

$("tabNew").onclick = () => createChat();
$("renameCurrent").onclick = () => currentChatId && renameChat(currentChatId);

$("settings").onclick = settings;

  renderMessages();
  toast(analysisMode ? "Analyse aan" : "Analyse uit");
};

$("search").oninput = renderChats;
send.onclick = sendMessage;
input.oninput = resizeInput;
input.onkeydown = e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
};

$("backupInput").onchange = e => {
  importBackupFile(e.target.files[0]);
  e.target.value = "";
};

messages.addEventListener("scroll", () => {
  const nearBottom =
    messages.scrollTop + messages.clientHeight >
    messages.scrollHeight - 200;
  jumpBottom.classList.toggle("visible", !nearBottom);
});
jumpBottom.onclick = () => scrollBottom(true);

/* ---------- INIT ---------- */

async function init(){
  loadTheme();
  try{ userName = localStorage.getItem(NAME_KEY) || "Gebruiker"; }catch{}
  applyUserName();

  try{
    const stored = JSON.parse(localStorage.getItem(STORAGE) || "null");
    if(stored && Array.isArray(stored.chats) && Array.isArray(stored.learned)){
      data = {
        version: 1,
        chats: stored.chats.map(sanitizeChat).filter(Boolean),
        learned: stored.learned
      };
    }
  }catch(e){
    console.warn("Lokale data kon niet gelezen worden", e);
  }

  await loadResponses();

  if(!data.chats.length){
    createChat("Nieuwe chat");
  } else {
    currentChatId = data.chats[0].id;
    renderChats(); renderMessages(); updateHeader();
  }
  resizeInput();

  /* klok elke seconde bijwerken */
  setInterval(updateClock, 1000);
}

init();
